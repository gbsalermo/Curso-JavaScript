<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio Strings</title>
</head>
<body>
    <script>
        const nome = prompt("Digite seu nome: "); //Peço o nome
        document.body.innerHTML += `O seu nome é: ${nome}<br />`; 
        let nomeSemEspaço = nome.replace(/\s/g, '');
        document.body.innerHTML += `Seu nome tem ${nomeSemEspaço. length} letras<br />`; //Uso o nome.replace para tirar os espaços em branco e o .length para pegar o tamanho
        document.body.innerHTML += `A segunda letra do seu nome é: ${nomeSemEspaço[1]} <br />`; 
        document.body.innerHTML += `Qual o primeiro indice da letra a no seu nome? ${nomeSemEspaço.indexOf('a', 0)} <br />`;
        document.body.innerHTML += `Qual o ultimo indice da letra a no seu nome? ${nomeSemEspaço.lastIndexOf('a', 30)} <br />`;
        document.body.innerHTML += `As últimas 3 letras do seu nome são: ${nomeSemEspaço.slice(-3)} <br />`;                  
        document.body.innerHTML += `As palavras do seu nome são: ${nome.split(' ')} <br />`; 
        document.body.innerHTML += `Seu nome com letras maiusculas: ${nome.toUpperCase()}<br />`; 
        document.body.innerHTML += `Seu nome com letras minusculas: ${nome.toLocaleLowerCase()}<br />`; 

    </script>
</body>
</html>
